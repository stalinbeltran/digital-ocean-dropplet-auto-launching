#cloud-config
# Configuración de primer arranque del droplet.
# El lanzador sustituye la línea marcadora de más abajo por todas las claves
# públicas seleccionadas, de modo que cada máquina desde la que trabajes pueda
# entrar sin tocar nada dentro del droplet.

users:
  - name: deploy
    groups: sudo
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    ssh_authorized_keys:
      # {{SSH_AUTHORIZED_KEYS}}

# Sin contraseñas por SSH: sólo clave pública.
ssh_pwauth: false
disable_root: false

package_update: true
package_upgrade: true
packages:
  - git
  - curl
  - ca-certificates
  - ufw
  - fail2ban

write_files:
  # Muchas redes corporativas bloquean el puerto 22 saliente, así que sshd
  # escucha además en el 443, que prácticamente nunca está filtrado.
  # En Ubuntu 24.04 sshd va activado por socket: la directiva `Port` de
  # sshd_config se ignora y hay que tocar ssh.socket.
  - path: /etc/systemd/system/ssh.socket.d/10-extra-ports.conf
    content: |
      [Socket]
      ListenStream=
      ListenStream=22
      ListenStream=443

runcmd:
  # Cortafuegos mínimo: sólo SSH, en sus dos puertos.
  - ufw allow 22/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - systemctl daemon-reload
  - sh -c 'systemctl restart ssh.socket || systemctl restart ssh'
  - systemctl enable --now fail2ban
  # Centinela: su existencia significa que el arranque terminó de verdad.
  # Compruébalo con: ssh <droplet> 'cloud-init status --wait'
  - touch /var/lib/cloud/READY

final_message: "Droplet listo tras $UPTIME segundos."
