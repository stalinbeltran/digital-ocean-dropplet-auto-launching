#cloud-config
# Configuración de primer arranque del droplet.
# El lanzador sustituye la línea marcadora de más abajo por todas las claves
# públicas seleccionadas, de modo que cada máquina desde la que trabajes pueda
# entrar sin tocar nada dentro del droplet.

users:
  - name: deploy
    groups: sudo
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    ssh_authorized_keys:
      # {{SSH_AUTHORIZED_KEYS}}

# Sin contraseñas por SSH: sólo clave pública.
ssh_pwauth: false
disable_root: false

# Quitar de en medio las actualizaciones automaticas de Ubuntu MIENTRAS dura
# este primer arranque. No es mania: los `packages:` de aqui abajo y el
# `apt-get install` de las herramientas piden el cerrojo de dpkg, y si
# `apt-daily` arranca a la vez se quedan esperando el tiempo que haga falta.
# Y arranca cuando le toca: su timer lleva un retardo ALEATORIO de hasta 12 h,
# asi que unas veces cae en el primer arranque y otras
# no. Medido el 2026-09-11 en dos droplets recien creados: el siguiente disparo
# salia a las 23:36 en uno y a la 01:46 del dia siguiente en el otro. Eso
# convierte la duracion del arranque en una loteria, y el 2026-09-10 por la
# noche dos `launch dev` seguidos se pasaron del plazo del lanzador.
#
# `systemctl stop` de un timer NO es persistente -vuelve solo en el siguiente
# arranque-, y ademas la ultima linea de `runcmd` los rearranca. O sea que lo
# que se desactiva es la CARRERA, no las actualizaciones: la ventana es
# exactamente el aprovisionamiento.
bootcmd:
  - [cloud-init-per, once, apt-daily-fuera, systemctl, stop, apt-daily.timer, apt-daily-upgrade.timer]

# `package_update` SI: sin listas frescas, el `packages:` de aqui abajo puede
# pedir versiones que ya no estan y fallar.
package_update: true

# `package_upgrade` NO, y esto es una decision medida, no un descuido. Desglose
# del arranque del 2026-09-11 (dev real, 293 s de punta a punta):
#   119 s  el dist-upgrade, 148 paquetes    <- esto
#    57 s  apt-get update y el resto del modulo de paquetes
#    42 s  los scripts de DigitalOcean (do-agent, droplet-agent), no nuestros
#    40 s  runcmd ENTERO, con Node, Claude Code, gh y uv dentro
#    16 s  los `packages:` de aqui abajo, 69 paquetes
#    26 s  de la API al arranque del kernel, tampoco nuestro
# O sea que lo que justifica la maquina cuesta 40 s, y el 40 % del arranque se
# iba en poner al dia un sistema que va a vivir horas.
#
# Y el problema no es el 40 %: es que ese numero CRECE SOLO. Cuantos mas meses
# pasen desde que DigitalOcean refresco la imagen, mas paquetes hay que subir.
# Es la clase de coste que un dia se sale del plazo del lanzador, y el plazo ya
# se salio dos veces la noche del 2026-09-10.
#
# Lo que se pierde, y por que se puede perder: la maquina nace con la imagen tal
# como la publica DigitalOcean. `unattended-upgrades` viene armado y `enabled`
# (comprobado el 2026-09-11: APT::Periodic::Unattended-Upgrade "1"), asi que los
# parches entran solos despues, en segundo plano, sin bloquear el arranque.
#
# Y un motivo que no es de tiempo: de esos 148 paquetes, 6 eran de `openssh` o
# del kernel. Actualizar openssh en pleno primer arranque es justo lo que este
# repo tiene anotado como causa de que sshd se quede sin arrancar, y el kernel
# nuevo no hace nada sin reiniciar -y aqui no se reinicia-. Sacarlo del camino
# critico quita tiempo Y quita riesgo del minuto mas fragil del droplet.
#
# MEDIDO DESPUES, mismo dia, misma region, droplet real: del arranque a
# DEV_READY, 168 s contra 293 s. El modulo de paquetes bajo de 192 s a 68,8 s,
# y todas las herramientas quedaron puestas igual.
package_upgrade: false

packages:
  - git
  - curl
  - ca-certificates
  - ufw
  - fail2ban
  # Para el instalador de herramientas de desarrollo de más abajo.
  - jq
  - unzip
  - ripgrep
  - build-essential
  # Python. El sistema ya trae el intérprete, pero no con qué instalar nada:
  # sin python3-venv, `python3 -m venv` falla aunque `python3` exista.
  # Ojo: en Ubuntu 24.04 `pip install` FUERA de un venv se niega a funcionar
  # (externally-managed-environment, PEP 668). Hay que usar venv o uv.
  - python3-venv
  - python3-pip
  - python3-dev

write_files:
  # Muchas redes corporativas bloquean el puerto 22 saliente, así que sshd
  # escucha además en el 443, que prácticamente nunca está filtrado.
  # En Ubuntu 24.04 sshd va activado por socket: la directiva `Port` de
  # sshd_config se ignora y hay que tocar ssh.socket.
  - path: /etc/systemd/system/ssh.socket.d/10-extra-ports.conf
    content: |
      [Socket]
      ListenStream=
      ListenStream=22
      ListenStream=443

  # Los mismos puertos, también en sshd_config. Bajo activación por socket esto
  # se ignora, pero hace falta por dos motivos:
  #   - si una actualización de openssh-server devuelve el arranque al
  #     ssh.service clásico, los puertos siguen siendo los correctos;
  #   - el agente de DigitalOcean (el que da la consola del navegador) decide a
  #     qué puerto conectarse leyendo el primer `Port` de sshd_config, no el
  #     socket. Sin esto apunta al 22 por defecto y adivina.
  - path: /etc/ssh/sshd_config.d/10-ports.conf
    content: |
      Port 22
      Port 443

  # Centinela: si sshd deja de escuchar, lo revive y deja constancia. El 24.04
  # alterna entre activación por socket y servicio clásico, y una actualización
  # de openssh-server por detrás puede dejarlo sin arrancar; sin esto el droplet
  # se queda inaccesible incluso por la consola web, que también depende de sshd.
  - path: /usr/local/sbin/ssh-watchdog
    permissions: '0755'
    content: |
      #!/bin/sh
      LOG=/var/log/ssh-watchdog.log
      if ss -lnt '( sport = :22 )' | grep -q LISTEN; then
        exit 0
      fi
      {
        echo "=== $(date -Is): nadie escucha en el 22, reviviendo sshd"
        systemctl daemon-reload
        systemctl restart ssh.socket || systemctl restart ssh
        systemctl --no-pager --lines=20 status ssh.socket ssh || true
        ss -lnt || true
      } >> "$LOG" 2>&1

  - path: /etc/systemd/system/ssh-watchdog.service
    content: |
      [Unit]
      Description=Revive sshd si deja de escuchar

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/ssh-watchdog

  # Herramientas de desarrollo: Node, Claude Code y gh.
  #
  # Aquí NO va ningún secreto. El `user_data` de cloud-init lo sirve la API de
  # metadatos del droplet y lo puede leer cualquier usuario sin privilegios:
  #   deploy$ curl http://169.254.169.254/metadata/v1/user-data   # devuelve todo
  # Los tokens los empuja `do_droplet.py provision` por SSH cuando esto termina.
  - path: /usr/local/sbin/dev-tools-install
    permissions: '0755'
    content: |
      #!/bin/bash
      # Instala el entorno de desarrollo. Idempotente: se puede volver a lanzar.
      set -u
      exec >>/var/log/dev-tools-install.log 2>&1
      echo "=== $(date -Is): instalando herramientas de desarrollo"

      export DEBIAN_FRONTEND=noninteractive

      # apt, npm y las descargas fallan de vez en cuando en una máquina recién
      # creada (mirrors, DNS aún asentándose). Reintentar sale gratis; quedarse
      # sin Claude Code en el droplet, no.
      retry() {
        n=0
        until "$@"; do
          n=$((n + 1))
          if [ "$n" -ge 5 ]; then
            echo "FALLO tras $n intentos: $*"
            return 1
          fi
          echo "reintento $n de: $*"
          sleep $((n * 10))
        done
      }

      # Node 22 desde NodeSource.
      #
      # Claude Code se instala por npm y NO con el instalador nativo
      # (curl https://claude.ai/install.sh). Ese instalador redirige a
      # downloads.claude.ai, que está en Google Cloud Storage y responde
      # 403 AccessDenied a las IPs de los droplets después de las primeras
      # descargas. Comprobado: 5 intentos seguidos, 5 x 403. npm sí aguanta.
      retry curl -fsSL https://deb.nodesource.com/setup_22.x -o /tmp/nodesource.sh
      retry bash /tmp/nodesource.sh
      retry apt-get install -y nodejs

      # Instalación global como root: el binario queda en /usr/bin/claude y lo
      # ve cualquier usuario sin tocar el PATH.
      retry npm install -g @anthropic-ai/claude-code

      # gh desde el .deb de releases. El repo apt oficial también vale, pero
      # esto es una descarga y un dpkg, sin llavero ni sources.list que mantener.
      GH_VER=$(curl -fsSL https://api.github.com/repos/cli/cli/releases/latest \
               | jq -r '.tag_name // empty' | tr -d v)
      case "$GH_VER" in
        [0-9]*) : ;;
        *) GH_VER=2.63.2 ;;  # la API de GitHub limita por IP sin autenticar
      esac
      retry curl -fsSL -o /tmp/gh.deb \
        "https://github.com/cli/cli/releases/download/v${GH_VER}/gh_${GH_VER}_linux_amd64.deb"
      retry dpkg -i /tmp/gh.deb

      # uv: instalador de paquetes y gestor de entornos de Python, un binario
      # estatico sin dependencias. Va a /usr/local/bin y no al home de root,
      # que es donde lo dejaria el instalador oficial (curl astral.sh | sh):
      # ahi no lo veria el usuario de trabajo.
      #
      # Para que sirve, ademas de ir rapido: en Ubuntu 24.04 `pip install`
      # fuera de un entorno virtual se niega a funcionar (PEP 668,
      # externally-managed-environment), y uv se salta ese problema entero.
      # Tambien sabe instalar otras versiones de Python si un proyecto pide
      # una que no es la del sistema.
      UV_TGZ=uv-x86_64-unknown-linux-gnu
      retry curl -fsSL -o /tmp/uv.tar.gz \
        "https://github.com/astral-sh/uv/releases/latest/download/${UV_TGZ}.tar.gz"
      tar -xzf /tmp/uv.tar.gz -C /tmp
      install -m 0755 "/tmp/${UV_TGZ}/uv" /usr/local/bin/uv
      install -m 0755 "/tmp/${UV_TGZ}/uvx" /usr/local/bin/uvx

      echo "--- versiones instaladas"
      node --version
      claude --version
      gh --version | head -1
      python3 --version
      uv --version

      # El testigo sólo se pone si está TODO. El lanzador espera este fichero
      # antes de inyectar los secretos; si falla la instalación, deja el otro
      # testigo para que falle rápido en vez de esperar en balde.
      if command -v claude >/dev/null && command -v gh >/dev/null \
         && command -v uv >/dev/null \
         && python3 -m venv --help >/dev/null 2>&1; then
        touch /var/lib/cloud/DEV_READY
        echo "=== $(date -Is): entorno de desarrollo listo"
      else
        touch /var/lib/cloud/DEV_FAILED
        echo "=== $(date -Is): FALTAN HERRAMIENTAS, revisa este log"
      fi

  - path: /etc/systemd/system/ssh-watchdog.timer
    content: |
      [Unit]
      Description=Comprueba cada minuto que sshd sigue escuchando

      [Timer]
      OnBootSec=2min
      OnUnitActiveSec=1min

      [Install]
      WantedBy=timers.target

runcmd:
  # Cortafuegos mínimo: sólo SSH, en sus dos puertos.
  - ufw allow 22/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - systemctl daemon-reload
  - systemctl enable ssh.socket
  - sh -c 'systemctl restart ssh.socket || systemctl restart ssh'
  - systemctl enable --now ssh-watchdog.timer
  - systemctl enable --now fail2ban
  # Después de asegurar el acceso, nunca antes: si la instalación se atasca, el
  # droplet ya es accesible y se puede mirar el log por SSH.
  - /usr/local/sbin/dev-tools-install
  # Y se devuelven las actualizaciones automaticas, que solo estaban apartadas
  # para que no compitieran por el cerrojo de dpkg durante el arranque.
  - sh -c 'systemctl start apt-daily.timer apt-daily-upgrade.timer || true'
  # Centinela: su existencia significa que el arranque terminó de verdad.
  # Compruébalo con: ssh <droplet> 'cloud-init status --wait'
  - touch /var/lib/cloud/READY

final_message: "Droplet listo tras $UPTIME segundos."
